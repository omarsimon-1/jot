[package]
name = "jot"
version = "0.6.0"
description = "A private daily journal for Omarchy: just a cursor and text."
license = "MIT"
repository = "https://github.com/omarsimon-1/jot"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
chrono = { version = "0.4.45", features = ["serde"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.1"
